<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2575fc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>
  
  <!-- V2Ray logo inspired design - stylized V with network nodes -->
  <path d="M 40 35 L 64 85 L 88 35" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Network nodes -->
  <circle cx="40" cy="35" r="6" fill="white"/>
  <circle cx="64" cy="85" r="6" fill="white"/>
  <circle cx="88" cy="35" r="6" fill="white"/>
  
  <!-- Connection lines -->
  <line x1="40" y1="35" x2="25" y2="50" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="88" y1="35" x2="103" y2="50" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="64" y1="85" x2="64" y2="100" stroke="white" stroke-width="3" opacity="0.6"/>
  
  <!-- Additional nodes -->
  <circle cx="25" cy="50" r="4" fill="white" opacity="0.8"/>
  <circle cx="103" cy="50" r="4" fill="white" opacity="0.8"/>
  <circle cx="64" cy="100" r="4" fill="white" opacity="0.8"/>
</svg>
